<section class="auth-shell"><div class="card auth-card">
  <h1>Forgot Password</h1><p class="subhead">Enter the email used for your customer account.</p>
  <app-error-message [message]="error()" />
  @if (message()) { <div class="alert alert-success">{{ message() }}</div> }
  <form #form="ngForm" (ngSubmit)="submit(form)">
    <div class="form-field"><label>Email</label><input type="email" name="email" [(ngModel)]="email" required email></div>
    <button class="btn" style="margin-top:16px" [disabled]="form.invalid || loading()">{{ loading() ? 'Sending...' : 'Send reset link' }}</button>
  </form>
  <div class="auth-links"><a routerLink="/login">Back to login</a></div>
</div></section>
