<section class="auth-shell"><div class="card auth-card">
  <h1>Reset Password</h1><p class="subhead">Choose a new password with at least 8 characters.</p>
  <app-error-message [message]="error()" />
  @if (message()) { <div class="alert alert-success">{{ message() }} <a routerLink="/login"><strong>Login</strong></a></div> }
  <form [formGroup]="form" (ngSubmit)="submit()">
    <div class="form-field"><label>New password</label><input type="password" formControlName="newPassword" autocomplete="new-password"></div>
    <button class="btn" style="margin-top:16px" [disabled]="loading()">{{ loading() ? 'Updating...' : 'Reset password' }}</button>
  </form>
</div></section>
